<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neo</title>
<style>
:root{--bg:#f4f5fb;--fg:#12141f;--mut:#6b7090;--a:#6a5cff;--b:#00c2ff;--card:#ffffffcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07080f;--fg:#eef0ff;--mut:#8a8fb0;--card:#14162299;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07080f;--fg:#eef0ff;--mut:#8a8fb0;--card:#14162299;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;text-align:center}
h1{font-size:15px;letter-spacing:.4em;font-weight:600;margin:28px 0 0;color:var(--mut)}
#stage{position:relative;width:260px;height:260px;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 30px #6a5cff55;transition:transform .5s cubic-bezier(.3,1.6,.5,1),box-shadow .5s,filter .5s;filter:saturate(.5) brightness(.8);animation:breathe 4s ease-in-out infinite}
.ring{position:absolute;inset:0;margin:auto;width:110px;height:110px;border-radius:50%;border:2px solid var(--b);opacity:0}
body.awake .orb{transform:scale(1.35);filter:none;box-shadow:0 0 70px #00c2ffaa,0 0 140px #6a5cff77;animation:pulse 1.2s ease-in-out infinite}
body.awake .ring{animation:ripple 1.8s ease-out infinite}
body.awake .ring:nth-child(2){animation-delay:.6s}
body.awake .ring:nth-child(3){animation-delay:1.2s}
body.think .orb{animation:spin 1s linear infinite;border-radius:42% 58% 55% 45%}
body.talk .orb{animation:talk .35s ease-in-out infinite alternate}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes pulse{50%{transform:scale(1.5)}}
@keyframes ripple{0%{transform:scale(1.3);opacity:.9}100%{transform:scale(3);opacity:0}}
@keyframes spin{to{transform:scale(1.3) rotate(360deg)}}
@keyframes talk{from{transform:scale(1.25)}to{transform:scale(1.6)}}
#bars{display:flex;gap:5px;height:34px;align-items:center;opacity:0;transition:opacity .4s}
body.awake #bars{opacity:1}
#bars i{width:5px;height:8px;border-radius:3px;background:linear-gradient(var(--a),var(--b));animation:bar .9s ease-in-out infinite}
#bars i:nth-child(2n){animation-delay:.15s}#bars i:nth-child(3n){animation-delay:.3s}#bars i:nth-child(5n){animation-delay:.45s}
@keyframes bar{50%{height:32px}}
#status{font-size:22px;font-weight:600;min-height:30px}
#heard{color:var(--mut);font-size:15px;min-height:40px;padding:0 24px}
.panel{width:100%;max-width:420px;padding:0 20px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;align-items:center}
.tip{background:var(--card);border-radius:16px;padding:12px 16px;font-size:13px;color:var(--mut);line-height:1.5;backdrop-filter:blur(8px)}
button{font:inherit;border:0;border-radius:24px;padding:12px 26px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));font-weight:600}
</style>
</head>
<body>
<h1>NEO</h1>
<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
  <div id="stage"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="orb"></div></div>
  <div id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="status">Tap to start</div>
  <div id="heard"></div>
</div>
<div class="panel">
  <div class="tip">Say <b>"Hey Neo"</b>, then: "what time is it", "open YouTube", "play lofi on YouTube", "call Mom", "search best pizza", "timer 5 minutes", "WhatsApp 9876543210 hello". Say <b>"that's it"</b> to sleep.</div>
  <button id="go">Start listening</button>
</div>
<script>
const $=id=>document.getElementById(id),B=document.body;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false,awake=false,idleT,busy=false;
const set=(s,h)=>{$('status').textContent=s;if(h!==undefined)$('heard').textContent=h};
function chime(up){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(up?500:700,c.currentTime);o.frequency.linearRampToValueAtTime(up?900:400,c.currentTime+.18);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.26)}catch(e){}}
function say(t,cb){set(t);B.classList.add('talk');try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.onend=u.onerror=()=>{B.classList.remove('talk');cb&&cb()};speechSynthesis.speak(u)}catch(e){B.classList.remove('talk');cb&&cb()}}
function wake(){awake=true;B.classList.add('awake');chime(true);set("I'm listening…");resetIdle()}
function sleep(){awake=false;B.classList.remove('awake','think','talk');chime(false);set('Say "Hey Neo"','');clearTimeout(idleT)}
function resetIdle(){clearTimeout(idleT);idleT=setTimeout(()=>awake&&say("Going to sleep.",sleep),9000)}
const open=u=>{setTimeout(()=>{location.href=u},900)};
function handle(q){
  q=q.toLowerCase().trim().replace(/^(hey|hi|hay)\s+(neo|nio|nia)[,.\s]*/,'');
  if(!q){set("I'm listening…");return}
  if(/\b(that'?s it|that is it|i'?m done|you'?re done|you are done|done|stop|bye|go to sleep)\b/.test(q)){say("Okay, I'm here if you need me.",sleep);return}
  B.classList.add('think');let m;
  const fin=t=>{B.classList.remove('think');say(t,resetIdle)};
  if(/time/.test(q)&&!/timer/.test(q))return fin("It's "+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));
  if(/\b(date|day is it|today)\b/.test(q))return fin(new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}));
  if(m=q.match(/timer (?:for )?(\d+)\s*(second|sec|minute|min|hour)/)){const n=+m[1],ms=n*(/^h/.test(m[2])?3600:/^m/.test(m[2])?60:1)*1000;setTimeout(()=>{chime(true);say("Your timer is done!")},ms);return fin(`Timer set for ${n} ${m[2]}s`)}
  if(m=q.match(/^(?:play|watch)\s+(.+?)(?:\s+on youtube)?$/))return fin("Playing "+m[1]),open('https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]));
  if(m=q.match(/^(?:call|dial|phone)\s+(.+)/)){const n=m[1].replace(/\s/g,'');return fin("Calling "+m[1]),open('tel:'+n)}
  if(m=q.match(/^(?:whatsapp|message|text)\s+(\+?[\d\s]{7,})\s*(.*)/)){const n=m[1].replace(/\s/g,'');return fin("Opening WhatsApp"),open('https://wa.me/'+n.replace('+','')+'?text='+encodeURIComponent(m[2]))}
  if(m=q.match(/^(?:navigate to|directions to|map of|find)\s+(.+)/))return fin("Opening maps for "+m[1]),open('https://www.google.com/maps/search/'+encodeURIComponent(m[1]));
  if(m=q.match(/^open\s+(.+)/)){const s={youtube:'https://youtube.com',google:'https://google.com',whatsapp:'https://wa.me',instagram:'https://instagram.com',maps:'https://maps.google.com',gmail:'https://mail.google.com',facebook:'https://facebook.com',twitter:'https://x.com',spotify:'https://open.spotify.com',settings:'#'}[m[1].replace(/\s/g,'')];return s?(fin("Opening "+m[1]),open(s)):fin("I can't open "+m[1]+" from a web page yet.")}
  if(/joke/.test(q))return fin("Why did the phone go to therapy? It had too many unresolved notifications.");
  if(/who are you|your name/.test(q))return fin("I'm Neo, your voice assistant.");
  if(m=q.match(/^(?:search(?: for)?|google|look up|what is|who is)\s+(.+)/))return fin("Searching for "+m[1]),open('https://www.google.com/search?q='+encodeURIComponent(m[1]));
  fin("Let me search that."),open('https://www.google.com/search?q='+encodeURIComponent(q));
}
function start(){
  if(!SR){set('Not supported','Open this page in Chrome on Android');return}
  if(on)return;on=true;$('go').style.display='none';
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';
  rec.onresult=e=>{
    let t='',fin=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;fin=e.results[i].isFinal}
    const wk=/\b(hey|hi|hay|a)\s*(neo|nio|nia|knee\s?oh|neon)\b/i;
    if(!awake){if(wk.test(t)){wake();const rest=t.replace(/.*?\b(neo|nio|nia|knee\s?oh|neon)\b[,.\s]*/i,'');if(fin&&rest)handle(rest);else if(rest)set("I'm listening…",rest)}}
    else{set(B.classList.contains('talk')?$('status').textContent:"I'm listening…",t);resetIdle();if(fin)handle(t)}
  };
  rec.onerror=e=>{if(e.error==='not-allowed'){on=false;set('Mic blocked','Allow microphone access and tap again');$('go').style.display=''}};
  rec.onend=()=>{if(on)try{rec.start()}catch(e){}};
  try{rec.start();set('Say "Hey Neo"','Listening for the wake word…')}catch(e){}
}
$('go').onclick=$('stage').onclick=()=>{if(!on)start();else if(!awake)wake();else sleep()};
</script>
</body>
</html>
